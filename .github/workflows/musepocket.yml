name: MusePocket iPhone
on:
  pull_request:
    paths: ['ios/**', 'esp32/components/noise_core/**', 'linux/src/musegadget/noise/**', '.github/workflows/musepocket.yml']
  push:
    branches: [main]
    paths: ['ios/**', 'esp32/components/noise_core/**', 'linux/src/musegadget/noise/**', '.github/workflows/musepocket.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  iphone:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare independent SDK responder
        run: |
          python3 -m venv /tmp/muse-relay-env
          /tmp/muse-relay-env/bin/pip install 'cryptography>=46,<47'
      - name: Test protocol, audio and Muse WebSocket integration
        env:
          MUSE_TEST_PYTHON: /tmp/muse-relay-env/bin/python
        run: bash ios/tools/test-muse-relay.sh
      - name: Generate native project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml
      - name: Test native services and UI on an available iPhone
        env:
          MUSE_TEST_PYTHON: /tmp/muse-relay-env/bin/python
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          bash ios/tools/test-muse-relay.sh xcodebuild -project ios/MusePocket.xcodeproj -scheme MusePocket \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/MusePocket CODE_SIGNING_ALLOWED=NO test
